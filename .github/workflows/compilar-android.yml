name: Compilar Entre Nosotros APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compilar:
    name: Crear APK de Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Aceptar licencias de Android
        run: yes | sdkmanager --licenses

      - name: Instalar herramientas de Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la aplicacion web
        run: npm run build

      - name: Verificar recursos de la aplicacion
        run: |
          test -f www/dist/prueba-dados-eroticos.html
          test -f www/dist/0/Dados/Reglas.png
          test -f www/dist/0/Dados/Kama.png
          test -f www/dist/0/Dados/Karmavolver.png
          test -f www/dist/assets/dados-eroticos/Botondados.mp4
          test -f www/dist/assets/dados-eroticos/Videolanza.mp4
          test -f www/dist/assets/dados-eroticos/Transicion3.mp4
          test -d www/dist/assets/dados-eroticos/combinaciones
          echo "Pagina de dados y recursos verificados."

      - name: Incluir el diseño personalizado
        run: |
          mkdir -p www/dist/css
          cp www/css/diario-libro.css www/dist/css/diario-libro.css
          cp www/css/lugares-especiales.css www/dist/css/lugares-especiales.css
          node <<'NODE'
          const fs = require('fs');
          const p = 'www/dist/index.html';
          let html = fs.readFileSync(p, 'utf8');
          const link = '<link rel="stylesheet" href="/css/diario-libro.css">';
          if (!html.includes(link)) {
            html = html.replace('<head>', '<head>\n  ' + link);
          }
          fs.writeFileSync(p, html);
          console.log('Diseño personalizado incluido en la compilación.');
          NODE

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Recuperar configuracion Firebase
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_B64" || { echo "ERROR: falta el secreto GOOGLE_SERVICES_JSON_B64"; exit 1; }
          printf "%s" "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          node -e 'const f=require("./android/app/google-services.json"); if(f.project_info?.project_id!=="entre-nosotros-16e41" || f.client?.[0]?.client_info?.android_client_info?.package_name!=="com.entrenosotros.app") process.exit(1); console.log("Configuracion Firebase validada.");'

      - name: Generar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: Entre-Nosotros-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
