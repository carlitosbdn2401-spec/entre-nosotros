<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vale por una noche picante</title>
<style>
*{box-sizing:border-box}

body{
  margin:0;min-height:100vh;padding:28px 18px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:32px;
  background:radial-gradient(ellipse at 50% 35%,#38212e,#160f18 75%);
  font-family:system-ui,sans-serif;color:#fff;
}

h1{
  margin:0;text-align:center;font-size:22px;
  font-weight:500;letter-spacing:1px;color:#f8dca0;
}

.stage{width:min(100%,520px);perspective:1000px}

.envelope{
  position:relative;width:100%;aspect-ratio:1.65;
  overflow:visible;
  background:linear-gradient(145deg,#f5bdce 0%,#e88fab 58%,#c96583 100%);
  border:2px solid #d4af37;
  box-shadow:0 25px 55px #0009,inset 0 0 22px #fff2;
  isolation:isolate;
}

/* CUERPO ROSA: NO CAMBIA AL ABRIR */
.body-shine{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 25%,#fff2 48%,transparent 70%);
}

/* INTERIOR BURDEOS: TRIANGULO ENTRE LAS DOS ESQUINAS
   SUPERIORES Y EL PUNTO CENTRAL DEL LACRADO */
.inside{
  position:absolute;inset:0;z-index:1;
  opacity:0;pointer-events:none;
  clip-path:polygon(0 0,100% 0,50% 43%);
  background:linear-gradient(145deg,#a54a69 0%,#84314f 52%,#54172f 100%);
  transition:opacity .25s ease;
}

/* LAS DOS DIAGONALES DORADAS DEL INTERIOR */
.fold{
  position:absolute;top:0;width:57.7%;height:2px;
  background:linear-gradient(90deg,#9a7024,#fff0b0 45%,#d4af37 80%,#fff0b0);
  box-shadow:0 1px 2px #3c1524;
}
.fold.left{
  left:0;transform-origin:left center;transform:rotate(27.5deg);
}
.fold.right{
  right:0;transform-origin:right center;transform:rotate(-27.5deg);
}

/* SOLAPA EXTERIOR ROSA, CON BORDE DORADO */
.flap{
  position:absolute;left:0;top:0;width:100%;height:43%;
  z-index:3;
  transform-origin:50% 0;
  transform:translateY(0);
  transition:transform .85s cubic-bezier(.2,.7,.2,1);
  clip-path:polygon(0 0,100% 0,50% 100%);
  background:linear-gradient(155deg,#f9d0dc 0%,#ed9bb4 58%,#d87596 100%);
  filter:drop-shadow(0 3px 2px #53223866);
}


/* CARA INTERIOR BURDEOS DE LA SOLAPA */
.flap::after{
  content:"";
  position:absolute;
  inset:0;
  clip-path:polygon(0 0,100% 0,50% 100%);
  background:linear-gradient(155deg,#84314f 0%,#641d39 58%,#421126 100%);
  transform:rotateX(180deg);
  backface-visibility:hidden;
  pointer-events:none;
}

/* El contorno dorado acompaña los dos pliegues de la solapa */
.flap-edge{
  position:absolute;top:0;width:57.7%;height:2px;
  background:linear-gradient(90deg,#a87926,#fff0b0,#d4af37);
}
.flap-edge.left{
  left:0;transform-origin:left center;transform:rotate(27.5deg);
}
.flap-edge.right{
  right:0;transform-origin:right center;transform:rotate(-27.5deg);
}

/* LACRADO DORADO */

/* DOS LINEAS DORADAS EXTERIORES HACIA EL LACRADO */
.seal-line{
  position:absolute;top:0;width:57.7%;height:2px;
  z-index:4;pointer-events:none;
  background:linear-gradient(90deg,#a87926,#fff0b0,#d4af37);
  box-shadow:0 1px 2px #3c1524;
}
.seal-line.left{
  left:0;transform-origin:left center;transform:rotate(27.5deg);
}
.seal-line.right{
  right:0;transform-origin:right center;transform:rotate(-27.5deg);
}

.seal{
  position:absolute;z-index:5;
  top:43%;left:50%;transform:translate(-50%,-50%);
  width:clamp(42px,11vw,58px);aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(circle at 32% 25%,#fff1bb 0%,#e6c66c 32%,#b58a32 68%,#77521b 100%);
  border:2px solid #f5e3a2;
  box-shadow:0 3px 9px #0008,inset 0 0 0 2px #9c762e;
  color:#fff4cb;font-size:clamp(23px,6vw,32px);
  text-shadow:0 1px 2px #75501c;
  transition:opacity .25s ease;
}

.envelope.open .inside{opacity:1}
.envelope.open .flap{transform:rotateX(180deg);transform-origin:50% 0;}
.envelope.open .seal{
  opacity:1;
  pointer-events:none;
  clip-path:polygon(6% 27%,0% 38%,0% 70%,15% 90%,30% 98%,50% 100%,70% 98%,85% 90%,100% 70%,100% 38%,94% 27%,50% 50%);
}


button{
  border:1px solid #f3d995;border-radius:30px;
  padding:13px 28px;background:linear-gradient(135deg,#f5d99a,#c79a40);
  color:#422535;font-size:16px;font-weight:650;
  box-shadow:0 5px 18px #0005;cursor:pointer;
}
button:active{transform:scale(.97)}

.note{margin:0;color:#d9b8c5;font-size:13px;text-align:center}

/* TARJETA DEL VALE: se añade sin alterar el sobre original */
.stage{position:relative}
.vale-card{
  position:absolute;z-index:2;
  left:50%;top:30%;
  width:86%;height:72%;
  transform:translate(-50%,0);
  opacity:0;pointer-events:none;
  overflow:hidden;border:2px solid #d4af37;
  border-radius:9px;
  background:linear-gradient(145deg,#6b1839,#300d20);
  box-shadow:0 8px 25px #0009, inset 0 0 12px #f8dca033;
  display:flex;flex-direction:column;
  transition:transform .95s cubic-bezier(.2,.7,.2,1),opacity .35s ease;
}
.vale-card video{
  display:block;width:100%;height:72%;
  min-height:0;object-fit:cover;object-position:center 50%;
  background:#250b19;
}
.vale-copy{
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:5px 8px;text-align:center;
  color:#ffe8b0;
  background:linear-gradient(110deg,#54142e,#812746,#421126);
}
.vale-title{
  margin:0;font-family:Georgia,serif;
  font-size:clamp(15px,4vw,22px);
  font-weight:600;letter-spacing:.5px;
  text-shadow:0 1px 5px #0008;
}
.vale-hearts{
  margin-top:3px;color:#f4c85d;
  font-size:clamp(14px,3.5vw,19px);
  animation:latidoVale 1.2s ease-in-out infinite;
}
@keyframes latidoVale{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.13)}
}
/* La tarjeta sube desde dentro; el lacrado original conserva su capa */
.envelope.open .vale-card{
  opacity:1;pointer-events:auto;
  transform:translate(-50%,-15%);
  transition-delay:.15s;
}
@media(prefers-reduced-motion:reduce){
  .vale-hearts{animation:none}
  .vale-card{transition-duration:.01ms}
}


/* PURPURINA DORADA ANIMADA ALREDEDOR DEL SOBRE */
.stage::before{
  content:"";
  position:absolute;
  z-index:4;
  pointer-events:none;
  inset:-24px;
  background:
    radial-gradient(circle at 8% 18%,#fff0ae 0 1px,transparent 2px),
    radial-gradient(circle at 17% 82%,#d4af37 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 28% 5%,#fff0ae 0 1px,transparent 2px),
    radial-gradient(circle at 43% 96%,#f5d777 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 61% 3%,#fff0ae 0 1px,transparent 2px),
    radial-gradient(circle at 76% 92%,#d4af37 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 91% 20%,#fff0ae 0 1px,transparent 2px),
    radial-gradient(circle at 97% 70%,#f5d777 0 1px,transparent 2px),
    radial-gradient(circle at 3% 54%,#f5d777 0 1px,transparent 2px),
    radial-gradient(circle at 84% 47%,#fff0ae 0 1px,transparent 2px);
  background-size:100% 100%;
  opacity:.35;
  animation:brilloDorado 2.4s ease-in-out infinite alternate;
  mask-image:radial-gradient(ellipse at center,transparent 48%,#000 66%,transparent 83%);
}
@keyframes brilloDorado{
  0%{opacity:.2;filter:brightness(.8)}
  100%{opacity:1;filter:brightness(1.7)}
}
@media(prefers-reduced-motion:reduce){
  .stage::before{animation:none;opacity:.6}
}


/* CORRECCIÓN DE RECORRIDO DE LA TARJETA */
.vale-card{
  top:8% !important;
  height:86% !important;
  transform:translate(-50%,0) !important;
  z-index:2;
}
.envelope.open .vale-card{
  transform:translate(-50%,-55%) !important;
  opacity:1;
}

/* DESACTIVAR LOS PUNTOS CSS ANTERIORES */
.stage::before{content:none!important}

/* PURPURINA DORADA: DESTELLOS Y PARTÍCULAS ANIMADAS */
.glitter-canvas{
  position:absolute;
  inset:-30px;
  width:calc(100% + 60px);
  height:calc(100% + 60px);
  z-index:4;
  pointer-events:none;
  -webkit-mask-image:radial-gradient(ellipse at center,
    transparent 0%,transparent 43%,#000 58%,#000 75%,transparent 91%);
  mask-image:radial-gradient(ellipse at center,
    transparent 0%,transparent 43%,#000 58%,#000 75%,transparent 91%);
}


/* AJUSTE COORDINADO DE CAPAS: TARJETA ENCAJADA */
.envelope .vale-card{
  top:8% !important;
  height:86% !important;
  transform:translate(-50%,0) !important;
  z-index:2 !important;
}
.envelope:not(.open) .vale-card{
  opacity:0;
  pointer-events:none;
}
.envelope.open .vale-card{
  opacity:1;
  pointer-events:auto;
  transform:translate(-50%,-54%) !important;
  z-index:2 !important;
}

/* La solapa gira detrás de la tarjeta al abrirse. */
.envelope .flap{z-index:3}
.envelope.open .flap{z-index:1}

/* Frente rosa que tapa la parte inferior de la tarjeta.
   Su borde superior forma la V del bolsillo del sobre. */
.pocket-front{
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
  opacity:0;
  clip-path:polygon(0 0,50% 43%,100% 0,100% 100%,0 100%);
  background:linear-gradient(
    145deg,#f5bdce 0%,#e88fab 58%,#c96583 100%
  );
  filter:drop-shadow(0 -1px 1px #d4af37);
  transition:opacity .25s ease;
}
.envelope.open .pocket-front{opacity:1}

/* El lacrado original conserva su capa superior. */
.envelope .seal{z-index:5}

</style>

<style id="purpurina-video-real">
.stage {
  position: relative;
  isolation: isolate;
}
.glitter-canvas {
  display: none !important;
}
.glitter-video-overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 20;
  pointer-events: none;
  opacity: 0;
  mix-blend-mode: screen;
  transition: opacity .25s ease;
}
</style>


<style>
/* TEXTO DEL VALE SIN FONDO BURDEOS */
.vale-card{
  background:transparent !important;
  border-color:transparent !important;
  box-shadow:none !important;
}
.vale-copy{
  background:transparent !important;
}
</style>


<style id="ajuste-final-frase-visible">
/* Tarjeta transparente y frase visible por encima del bolsillo */
.envelope.open .vale-card{
  transform:translate(-50%,-68%) !important;
  background:transparent !important;
  border-color:transparent !important;
  box-shadow:none !important;
}
.envelope .vale-copy{
  background:transparent !important;
}
</style>


<style id="texto-directamente-sobre-video">
.envelope .vale-card{
  isolation:isolate !important;
}
.envelope .vale-card video{
  position:absolute !important;
  inset:0 !important;
  width:100% !important;
  height:100% !important;
  z-index:0 !important;
  object-fit:cover !important;
}
.envelope .vale-copy{
  position:absolute !important;
  inset:0 !important;
  z-index:1 !important;
  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  justify-content:flex-end !important;
  padding:0 8px 4% !important;
  background:transparent !important;
}
.envelope .vale-title{
  color:#ffe8b0 !important;
  text-shadow:0 1px 5px #000, 0 0 3px #000 !important;
}
.envelope .vale-hearts{
  text-shadow:0 1px 4px #000 !important;
}

/* Marco dorado de la tarjeta */
.envelope .vale-card{
  box-sizing:border-box !important;
  border:2px solid #d4af37 !important;
  border-radius:9px !important;
}
/* Mantener transparente el fondo del texto */
.envelope .vale-copy{
  background:transparent !important;
}
</style>


<style id="marco-dorado-visible">
.envelope.open .vale-card{
  border:2px solid #d4af37 !important;
  border-radius:9px !important;
}
.envelope .vale-card video{
  inset:2px !important;
  width:calc(100% - 4px) !important;
  height:calc(100% - 4px) !important;
}
</style>


<style id="texto-cena-especial-arriba">
.envelope .vale-copy{
  justify-content:flex-start !important;
  padding:3% 8px 0 !important;
}
</style>

</head>
<body>

<h1>Vale por una noche picante</h1>

<div class="stage">
  <div class="envelope" id="sobre">
    <div class="body-shine"></div>

    <div class="inside" aria-hidden="true">
      <div class="fold left"></div>
      <div class="fold right"></div>
    </div>


    <div class="vale-card" aria-label="Vale Vale por una noche picante">
      <video
        src="/assets/vale-picante.mp4"
        autoplay muted loop playsinline preload="metadata"
        aria-label="Vídeo de una pareja en una escena sensual">
      </video>
      <div class="vale-copy">
        <p class="vale-title">Vale por una noche picante</p>
        <div class="vale-hearts" aria-hidden="true">♥ ♥ ♥</div>
      </div>
    </div>

    <div class="flap" aria-hidden="true">
      <div class="flap-edge left"></div>
      <div class="flap-edge right"></div>
    </div>

    <div class="pocket-front" aria-hidden="true"></div>

    <div class="seal-line left" aria-hidden="true"></div>
    <div class="seal-line right" aria-hidden="true"></div>
    <div class="seal" aria-hidden="true">♥</div>
  </div>
</div>

<button id="boton" type="button">Abrir sobre</button>
<p class="note">Abre el sobre para descubrir vuestra noche picante.</p>

<script>
const sobre = document.getElementById('sobre');
const boton = document.getElementById('boton');

boton.addEventListener('click', () => {
  const abierto = sobre.classList.toggle('open');
  boton.textContent = abierto ? 'Cerrar sobre' : 'Abrir sobre';
});
</script>


<script>
/* Purpurina dorada en vídeo: solo al abrir el sobre */
(() => {
  const stage = document.querySelector('.stage');
  const sobre = document.getElementById('sobre');
  const boton = document.getElementById('boton');
  if (!stage || !sobre || !boton) return;

  const video = document.createElement('video');
  video.className = 'glitter-video-overlay';
  video.src = '/assets/gold-glitter-fall.mp4';
  video.muted = true;
  video.playsInline = true;
  video.preload = 'auto';
  video.loop = true;
  video.setAttribute('aria-hidden', 'true');
  stage.appendChild(video);

  function ocultar() {
    video.style.opacity = '0';
    video.pause();
  }

  boton.addEventListener('click', () => {
    if (sobre.classList.contains('open')) {
      video.pause();
      try { video.currentTime = 0; } catch (_) {}
      video.style.opacity = '0.88';
      const reproduccion = video.play();
      if (reproduccion && reproduccion.catch) {
        reproduccion.catch(() => ocultar());
      }
    } else {
      ocultar();
      try { video.currentTime = 0; } catch (_) {}
    }
  });

  video.addEventListener('error', () => {
    ocultar();
    console.error('No se pudo reproducir el vídeo de purpurina.');
  });
})();
</script>

</body>
</html>
